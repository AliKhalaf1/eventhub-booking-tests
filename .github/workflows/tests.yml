name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: false

env:
  USER_EMAIL: ${{ secrets.USER_EMAIL }}
  USER_PASSWORD: ${{ secrets.USER_PASSWORD }}
  USER2_EMAIL: ${{ secrets.USER2_EMAIL }}
  USER2_PASSWORD: ${{ secrets.USER2_PASSWORD }}
  BASE_URL: https://eventhub.rahulshettyacademy.com
  API_URL: https://api.eventhub.rahulshettyacademy.com/api
  HEADLESS: "true"
  UI_TIMEOUT_MS: "30000"

jobs:
  api-tests:
    name: API tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Run API tests
        run: ./mvnw -B -ntp -pl api-tests -am verify
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: api-test-reports
          path: api-tests/target/surefire-reports/

  ui-tests:
    name: UI tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Build framework
        run: ./mvnw -B -ntp install -DskipTests
      - name: Install Chromium and its system dependencies
        run: ./mvnw -B -ntp -pl ui-tests exec:java -Dexec.args="install --with-deps chromium"
      - name: Run UI tests
        env:
          BROWSER: chromium
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
        run: ./mvnw -B -ntp -pl ui-tests verify
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: ui-test-reports
          path: ui-tests/target/surefire-reports/
      - name: Upload failure evidence (traces, screenshots)
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: ui-failure-evidence
          path: |
            ui-tests/target/playwright-traces/
            ui-tests/target/screenshots/
          if-no-files-found: ignore
